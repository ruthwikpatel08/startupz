<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <title>HookZ — Find Hackathon Teammates & Connect with Student Builders</title>
  <meta name="description"
    content="HookZ is a student-first platform to find hackathon teammates, connect with like-minded peers across frontend, backend, design, and pitching, and build project teams." />
  <link rel="canonical" href="https://hookz.in/" />
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
  <meta name="author" content="HookZ" />
  <meta name="application-name" content="HookZ" />
  <meta name="theme-color" content="#4f46e5" />

  <!-- Open Graph / Facebook / LinkedIn -->
  <meta property="og:site_name" content="HookZ" />
  <meta property="og:title"
    content="HookZ is a student-first platform to find hackathon teammates, connect with like-minded peers across frontend, backend, design, and pitching, and build project teams." />
  <meta property="og:url" content="https://hookz.in/" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://hookz.in/og-image.png" />
  <meta property="og:image:alt" content="HookZ — Student Networking Platform" />
  <meta property="og:locale" content="en_US" />

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="HookZ is a student-first platform to find teammates for Projects" />
  <meta name="twitter:description"
    content="HookZ is a student-first platform to find hackathon teammates, connect with like-minded peers across frontend, backend, design, and pitching, and build project teams." />
  <meta name="twitter:image" content="https://hookz.in/og-image.png" />
  <meta name="twitter:image:alt" content="HookZ — Student Networking Platform" />

  <!-- Favicons -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" href="/logo-icon.png" />
  <link rel="apple-touch-icon" href="/logo-icon.png" />

  <!-- Structured Data (JSON-LD) -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://hookz.in/#website",
          "url": "https://hookz.in/",
          "name": "HookZ",
          "description": "HookZ is a student-first platform to find hackathon teammates, connect with like-minded peers across frontend, backend, design, and pitching, and build project teams.",
          "inLanguage": "en-US",
          "potentialAction": {
            "@type": "SearchAction",
            "target": {
              "@type": "EntryPoint",
              "urlTemplate": "https://hookz.in/search?q={search_term_string}"
            },
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "Organization",
          "@id": "https://hookz.in/#organization",
          "name": "HookZ",
          "url": "https://hookz.in/",
          "logo": {
            "@type": "ImageObject",
            "url": "https://hookz.in/logo.png"
          },
          "description": "HookZ is a student-first platform to find hackathon teammates, connect with like-minded peers across frontend, backend, design, and pitching, and build project teams."
        }
      ]
    }
    </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body
  class="bg-[#F8F9FB] dark:bg-[#0B0F17] text-[#181A1F] dark:text-[#F8F9FB] antialiased selection:bg-brand-600 selection:text-white min-h-screen">
  <noscript>
    <div
      style="padding: 24px; max-width: 800px; margin: 0 auto; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #1e293b;">
      <h1 style="font-size: 20px; font-weight: 700; margin-bottom: 8px;">HookZ — Startup &amp; Venture Directory</h1>
      <p style="font-size: 14px; color: #475569; line-height: 1.6;">
        Connect with student developers, designers, and presenters, build project teams, and win hackathons together.
        Please enable JavaScript in your browser to access student directories, skill search, and collaboration
        workspaces.
      </p>
    </div>
  </noscript>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
